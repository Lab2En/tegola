<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Keangnam Buildings with Zoom-Based Styling on GeoJSON</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
  <script src="https://unpkg.com/maplibre-gl@3.3.1/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@3.3.1/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    body { margin: 0; padding: 0; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }

    #controls {
      position: absolute;
      top: 10px;
      left: 10px;
      background: white;
      padding: 10px;
      border-radius: 4px;
      font-family: sans-serif;
      font-size: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
      z-index: 1;
    }

    #zoom-level {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(255,255,255,0.9);
      padding: 5px 10px;
      font-family: sans-serif;
      font-size: 14px;
      border-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
      z-index: 1;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="controls">
    <label><input type="checkbox" id="toggle-intervals" checked> Roads</label><br>
    <label><input type="checkbox" id="toggle-buildings" checked> Buildings</label><br>
    <label><input type="checkbox" id="toggle-stations" checked> Stations</label><br>
    <label><input type="checkbox" id="toggle-entrances" checked> Entrances</label>
  </div>
  <div id="zoom-level">Zoom: --</div>

  <script>
    const map = new maplibregl.Map({
      container: 'map',
      antialias: true,
      style: {
        version: 8,
        glyphs: "https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf",
        sources: {
          osm: {
            type: 'raster',
            tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
            tileSize: 256,
            attribution: '© OpenStreetMap contributors'
          },
          tegola: {
            type: 'vector',
            tiles: ['http://www.sntglobal.net:8680/maps/keangnam/{z}/{x}/{y}.vector.pbf'],
            minzoom: 0,
            maxzoom: 20,
            attribution: '© Tegola'
          }
        },
        // The original kn_bld_entrance layer is removed from here
        // It will be added dynamically from a GeoJSON source
        layers: [
          { id: 'osm', type: 'raster', source: 'osm', minzoom: 0, maxzoom: 24 },
          {
            id: 'kn_intervals',
            type: 'line',
            source: 'tegola',
            'source-layer': 'kn_intervals',
            paint: { 'line-color': '#ff0000', 'line-width': 2 }
          },
          {
            id: 'kn_buildings',
            type: 'fill',
            source: 'tegola',
            'source-layer': 'kn_buildings',
            paint: { 'fill-color': '#0786e0', 'fill-opacity': 0.8 }
          },
          {
            id: 'kn_stations',
            type: 'fill',
            source: 'tegola',
            'source-layer': 'kn_stations',
            paint: { 'fill-color': '#b707ed', 'fill-opacity': 0.9 }
          }
        ]
      },
      center: [127.05, 37.512],
      zoom: 12 // Start more zoomed out to see the effect
    });

    map.on('load', () => {
      // --- NEW LOGIC: CREATE GEOJSON LAYER FROM VECTOR TILES ---
      const setupGeoJsonLayer = () => {
        if (map.getSource('entrances-geojson')) {
          return; // Already setup
        }

        const entranceFeatures = map.querySourceFeatures('tegola', {
          sourceLayer: 'kn_bld_entrance'
        });
        
        if (!entranceFeatures.length) {
            console.warn("Could not find entrance features to create GeoJSON layer.");
            return;
        }

        // 1. Create a new GeoJSON source from the vector tile data
        map.addSource('entrances-geojson', {
            type: 'geojson',
            data: {
                type: 'FeatureCollection',
                features: entranceFeatures
            }
        });

        // 2. Add a new layer that uses the GeoJSON source and has zoom-based styling
        map.addLayer({
            id: 'entrances-geojson-layer',
            type: 'circle',
            source: 'entrances-geojson', // Use the new GeoJSON source
            paint: {
              'circle-color': '#fc3f6e',
              'circle-stroke-color': '#ffffff',
              
              // Use 'interpolate' to change radius based on zoom
              'circle-radius': [
                'interpolate',
                ['linear'],
                ['zoom'],
                12, 1.5,  // At zoom 12, radius is 1.5px (small dot)
                18, 6     // At zoom 18, radius is 6px (large circle)
              ],
              
              // Use 'interpolate' to change stroke width based on zoom
              'circle-stroke-width': [
                'interpolate',
                ['linear'],
                ['zoom'],
                15, 0,    // At zoom 15, stroke is 0px (no stroke)
                17, 1.5   // At zoom 17, stroke is 1.5px (visible stroke)
              ]
            }
        });
        
        // Unbind the event listener once we're done
        map.off('sourcedata', onSourceData);
      };

      const onSourceData = (e) => {
        if (e.sourceId === 'tegola' && map.isSourceLoaded('tegola')) {
          setupGeoJsonLayer();
        }
      };
      
      map.on('sourcedata', onSourceData);

      // --- END OF NEW LOGIC ---
      
      map.addSource('highlight-source', {
        type: 'geojson',
        data: { type: 'FeatureCollection', features: [] }
      });

      map.addLayer({
        id: 'feature-highlight-fill',
        type: 'fill',
        source: 'highlight-source',
        paint: { 'fill-color': '#ffff00', 'fill-opacity': 0.75 },
        layout: { visibility: 'none' }
      });

      map.addLayer({
        id: 'feature-highlight-lineOnly',
        type: 'line',
        source: 'highlight-source',
        paint: { 'line-color': '#ffff00', 'line-width': 5 },
        layout: { visibility: 'none' }
      });

      map.addLayer({
        id: 'feature-highlight-circle',
        type: 'circle',
        source: 'highlight-source',
        paint: { 'circle-radius': 10, 'circle-color': '#ffff00', 'circle-stroke-color': '#ff9900', 'circle-stroke-width': 3 },
        layout: { visibility: 'none' }
      });
    });

    function setHighlight(type) {
      const layers = ['feature-highlight-fill', 'feature-highlight-lineOnly', 'feature-highlight-circle'];
      layers.forEach(id => map.setLayoutProperty(id, 'visibility', 'none'));

      if (type === 'Polygon' || type === 'MultiPolygon') {
        map.setLayoutProperty('feature-highlight-fill', 'visibility', 'visible');
      } else if (type === 'LineString' || type === 'MultiLineString') {
        map.setLayoutProperty('feature-highlight-lineOnly', 'visibility', 'visible');
      } else if (type === 'Point' || type === 'MultiPoint') {
        map.setLayoutProperty('feature-highlight-circle', 'visibility', 'visible');
      }
    }

    // --- SIMPLIFIED LAYER TOGGLES ---
    document.getElementById('toggle-intervals').onchange = e =>
      map.setLayoutProperty('kn_intervals', 'visibility', e.target.checked ? 'visible' : 'none');

    document.getElementById('toggle-buildings').onchange = e =>
      map.setLayoutProperty('kn_buildings', 'visibility', e.target.checked ? 'visible' : 'none');

    document.getElementById('toggle-stations').onchange = e =>
      map.setLayoutProperty('kn_stations', 'visibility', e.target.checked ? 'visible' : 'none');

    // This checkbox now controls the new GeoJSON layer
    document.getElementById('toggle-entrances').onchange = e => {
        const visibility = e.target.checked ? 'visible' : 'none';
        if (map.getLayer('entrances-geojson-layer')) {
            map.setLayoutProperty('entrances-geojson-layer', 'visibility', visibility);
        }
    };

    function updateZoomDisplay() {
      document.getElementById('zoom-level').innerText = `Zoom: ${map.getZoom().toFixed(2)}`;
    }
    map.on('zoom', updateZoomDisplay);
    map.on('load', updateZoomDisplay);

    const popup = new maplibregl.Popup({ closeButton: true, closeOnClick: true });

    // --- SIMPLIFIED CLICK HANDLER ---
    map.on('click', e => {
      // Update layers array to include the new GeoJSON layer
      const features = map.queryRenderedFeatures(e.point, {
        layers: ['kn_intervals', 'kn_buildings', 'kn_stations', 'entrances-geojson-layer']
      });

      if (!features.length) {
        popup.remove();
        map.getSource('highlight-source').setData({ type: 'FeatureCollection', features: [] });
        setHighlight(null);
        return;
      }

      const feature = features[0];
      
      // The source is now conditional
      const isGeoJsonFeature = feature.layer.id === 'entrances-geojson-layer';
      const sourceId = isGeoJsonFeature ? 'entrances-geojson' : 'tegola';
      const sourceLayer = isGeoJsonFeature ? null : feature.layer['source-layer'];
      
      const queryOptions = { filter: ['==', 'id', feature.properties.id] };
      if (sourceLayer) {
        queryOptions.sourceLayer = sourceLayer;
      }

      const fullFeatures = map.querySourceFeatures(sourceId, queryOptions);

      const highlightFeatures = fullFeatures.length ? fullFeatures : [feature];
      map.getSource('highlight-source').setData({
        type: 'FeatureCollection',
        features: highlightFeatures
      });

      setHighlight(feature.geometry.type);

      let html = `<strong>Feature type: ${feature.layer.id}</strong><br><table>`;
      for (const key in feature.properties) {
        html += `<tr><td><strong>${key}</strong></td><td>${feature.properties[key]}</td></tr>`;
      }
      html += '</table>';
      popup.setLngLat(e.lngLat).setHTML(html).addTo(map);
    });

    // --- SIMPLIFIED INTERACTIVE LAYERS ---
    // Update interactive layers to include the new GeoJSON layer
    const interactiveLayers = ['kn_intervals', 'kn_buildings', 'kn_stations', 'entrances-geojson-layer'];
    interactiveLayers.forEach(layer => {
      map.on('mouseenter', layer, () => (map.getCanvas().style.cursor = 'pointer'));
      map.on('mouseleave', layer, () => (map.getCanvas().style.cursor = ''));
    });
  </script>
</body>
</html>
