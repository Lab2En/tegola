<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Vientiane Roads</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
  <script src="https://unpkg.com/maplibre-gl@3.3.1/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@3.3.1/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    body { margin: 0; padding: 0; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    #controls {
      position: absolute;
      top: 10px;
      left: 10px;
      background: white;
      padding: 10px;
      border-radius: 4px;
      font-family: sans-serif;
      font-size: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
      z-index: 1;
    }
    #zoom-level {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(255,255,255,0.9);
      padding: 5px 10px;
      font-family: sans-serif;
      font-size: 14px;
      border-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
      z-index: 1;
    }
  </style>
</head>
<body>

<div id="map"></div>
<div id="controls">
  <label><input type="checkbox" id="toggle-provinces" checked> Provinces</label><br>
  <label><input type="checkbox" id="toggle-districts"> Districts</label><br>
  <label><input type="checkbox" id="toggle-roads" checked> Roads</label><br>
  <label><input type="checkbox" id="toggle-parcels" checked> Parcels</label><br>
  <label><input type="checkbox" id="toggle-landvaluesubzone" checked> Value Point</label>
</div>
<div id="zoom-level">Zoom: --</div>

<script>
const map = new maplibregl.Map({
  container: 'map',
  antialias: true,
  style: {
    version: 8,
	glyphs: "http://sntglobal.net/static/mbfonts/{fontstack}/{range}.pbf",
    sources: {
      osm: {
        type: 'raster',
        tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
        tileSize: 256,
        attribution: '© OpenStreetMap contributors'
      },
      tegola: {
        type: 'vector',
        tiles: ['http://www.sntglobal.net:8680/maps/vientiane/{z}/{x}/{y}.vector.pbf'],
        minzoom: 0,
        maxzoom: 20,
        attribution: '© Tegola'
      }
    },
    layers: [
      { id: 'osm', type: 'raster', source: 'osm', minzoom: 0, maxzoom: 24 },
      {
        id: 'provinces',
        type: 'fill',
        source: 'tegola',
        'source-layer': 'provinces',
        paint: {
          'fill-color': '#faf20a',
          'fill-outline-color': '#666666',
          'fill-opacity': 0.7
        },
        minzoom: 0,
        maxzoom: 24
      },
      {
        id: 'province-labels',
        type: 'symbol',
        source: 'tegola',
        'source-layer': 'provinces',
        layout: {
          'text-field': ['get', 'province_lao'],
          'text-font': ['Noto Sans Bold'],
          'text-size': 14,
          'text-anchor': 'center',
          'symbol-placement': 'point'
        },
        paint: {
          'text-color': '#f57d7d',
          'text-halo-color': '#ffffff',
          'text-halo-width': 2
        },
        minzoom: 0,
        maxzoom: 24
      },
      {
        id: 'districts',
        type: 'fill',
        source: 'tegola',
        'source-layer': 'districts',
		layout: { visibility: 'none' }, 
        paint: {
          'fill-color': '#05f7c7',
          'fill-outline-color': '#8b6bed',
          'fill-opacity': 0.3
        },
        minzoom: 0,
        maxzoom: 24
      },
	  {
		id: 'district-labels',
		type: 'symbol',
		source: 'tegola', 
		'source-layer': 'districts', 
		layout: {
		   'text-field': ['get', 'district_lao'],  
		   'text-font': ['Noto Sans Regular'],      
		   'text-size': 12,
		   'text-anchor': 'center',
		   'visibility': 'none'
		},
		paint: {
		   'text-color': '#000000',
		   'text-halo-color': '#ffffff',
		   'text-halo-width': 1
		},
		minzoom: 0,
        maxzoom: 24
	  },	  
      {
        id: 'roads',
        type: 'line',
        source: 'tegola',
        'source-layer': 'roads',
        paint: {
          'line-color': '#8607ed',
          'line-width': 2
        }
      },
      {
        id: 'parcels',
        type: 'fill',
        source: 'tegola',
        'source-layer': 'parcels',
        paint: {
          'fill-color': '#f03805',
          'fill-opacity': 0.8
        },
        minzoom: 0,
        maxzoom: 24
      },
      {
        id: 'parcels-outline',
        type: 'line',
        source: 'tegola',
        'source-layer': 'parcels',
        paint: {
          'line-color': '#800000',
          'line-width': 1
        },
        minzoom: 0,
        maxzoom: 24
      },
      {
        id: 'landvaluesubzone',
        type: 'circle',
        source: 'tegola',
        'source-layer': 'landvaluesubzone',
        paint: {
          'circle-radius': 5,
          'circle-color': '#0ecb81',
          'circle-stroke-color': '#003300',
          'circle-stroke-width': 1
        },
        minzoom: 0,
        maxzoom: 24
      },
	  {
		id: 'landvaluesubzone-labels',
		type: 'symbol',
		source: 'tegola',
		'source-layer': 'landvaluesubzone',
		layout: {
		   'text-field': ['to-string', ['get', 'value']], 
		   'text-font': ['Noto Sans Regular'],
		   'text-size': 12,
		   'text-anchor': 'top',              // text appears below circle
		   'text-offset': [0, 0.8],           // push label downward
		   'symbol-placement': 'point'
		},
		paint: {
		   'text-color': '#000000',
		   'text-halo-color': '#ffffff',
		   'text-halo-width': 1
		},
		minzoom: 10,
		maxzoom: 24
	  }	  
    ]
  },
  center: [102.6090, 17.9600],
  zoom: 6
});

map.on('load', () => {
  map.addSource('highlight-source', {
    type: 'geojson',
    data: { type: 'FeatureCollection', features: [] }
  });
  map.addLayer({
    id: 'feature-highlight-fill',
    type: 'fill',
    source: 'highlight-source',
    paint: {
      'fill-color': '#ffff00',
      'fill-opacity': 1,
      'fill-antialias': true
    },
    layout: { visibility: 'none' }
  });

  map.addLayer({
    id: 'feature-highlight-line',
    type: 'line',
    source: 'highlight-source',
    paint: {
      'line-color': '#ffff00',
      'line-width': 5
    },
    layout: { visibility: 'none' }
  });

  map.addLayer({
    id: 'feature-highlight-circle',
    type: 'circle',
    source: 'highlight-source',
    paint: {
      'circle-radius': 10,
      'circle-color': '#ffff00',
      'circle-stroke-color': '#ff9900',
      'circle-stroke-width': 3
    },
    layout: { visibility: 'none' }
  });
});

function setHighlightLayer(type) {
  const layers = ['feature-highlight-fill', 'feature-highlight-line', 'feature-highlight-circle'];
  layers.forEach(id => map.setLayoutProperty(id, 'visibility', 'none'));
  
  if (type === 'Polygon' || type === 'MultiPolygon') {
    map.setLayoutProperty('feature-highlight-fill', 'visibility', 'visible');
  } else if (type === 'LineString' || type === 'MultiLineString') {
    map.setLayoutProperty('feature-highlight-line', 'visibility', 'visible');
  } else if (type === 'Point' || type === 'MultiPoint') {
    map.setLayoutProperty('feature-highlight-circle', 'visibility', 'visible');
  }
}

document.getElementById('toggle-roads').addEventListener('change', function() {
  map.setLayoutProperty('roads', 'visibility', this.checked ? 'visible' : 'none');
});

document.getElementById('toggle-parcels').addEventListener('change', function() {
  const visibility = this.checked ? 'visible' : 'none';
  map.setLayoutProperty('parcels', 'visibility', visibility);
  map.setLayoutProperty('parcels-outline', 'visibility', visibility);
});

document.getElementById('toggle-provinces').addEventListener('change', function() {
  const visibility = this.checked ? 'visible' : 'none';
  map.setLayoutProperty('provinces', 'visibility', visibility);
  map.setLayoutProperty('province-labels', 'visibility', visibility);
});
document.getElementById('toggle-districts').addEventListener('change', function() {
  const visibility = this.checked ? 'visible' : 'none';
  map.setLayoutProperty('districts', 'visibility', visibility);
  map.setLayoutProperty('district-labels', 'visibility', visibility);
});
document.getElementById('toggle-landvaluesubzone').addEventListener('change', function() {
  const visibility = this.checked ? 'visible' : 'none';
  map.setLayoutProperty('landvaluesubzone', 'visibility', visibility);
  map.setLayoutProperty('landvaluesubzone-labels', 'visibility', visibility);
});

function updateZoomDisplay() {
  document.getElementById('zoom-level').innerText = `Zoom: ${map.getZoom().toFixed(2)}`;
}
map.on('zoom', updateZoomDisplay);
map.on('load', updateZoomDisplay);

const popup = new maplibregl.Popup({ closeButton: true, closeOnClick: true });

map.on('click', e => {
  const zoom = map.getZoom();
  
  const features = map.queryRenderedFeatures(e.point, {
    layers: ['provinces', 'districts', 'roads', 'parcels', 'landvaluesubzone']
  });

  if (!features.length) {
    popup.remove();
    if (map.getSource('highlight-source')) {
      map.getSource('highlight-source').setData({ type: 'FeatureCollection', features: [] });
    }
    setHighlightLayer(null);
    return;
  }

  const feature = features[0];
  
  const layerId = feature.layer.id;
  // Provinces & districts: only clickable at zoom <= 6
  if ((layerId === 'provinces' || layerId === 'districts') && zoom > 6) {
    return;
  }  

  const fullFeatures = map.querySourceFeatures('tegola', {
    sourceLayer: feature.layer['source-layer'],
    filter: ['==', 'id', feature.properties.id]
  });

  const highlightFeatures = fullFeatures.length ? fullFeatures : [feature];

  map.getSource('highlight-source').setData({
    type: 'FeatureCollection',
    features: highlightFeatures
  });

  setHighlightLayer(feature.geometry.type);

  let html = `<strong>Feature type: ${feature.layer.id}</strong><br><table>`;
  for (const key in feature.properties) {
    html += `<tr><td><strong>${key}</strong></td><td>${feature.properties[key]}</td></tr>`;
  }
  html += '</table>';

  popup.setLngLat(e.lngLat).setHTML(html).addTo(map);
});

['provinces', 'districts', 'roads', 'parcels', 'landvaluesubzone'].forEach(layer => {
  map.on('mouseenter', layer, () => map.getCanvas().style.cursor = 'pointer');
  map.on('mouseleave', layer, () => map.getCanvas().style.cursor = '');
});
</script>
</body>
</html>
